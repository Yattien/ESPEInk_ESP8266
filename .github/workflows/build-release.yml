name: Build and publish firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP8266 firmware
        run: pio run -e esp12e
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .pio/build/esp12e/firmware.bin firmware.bin
          gh release upload "${GITHUB_REF_NAME}" firmware.bin --clobber